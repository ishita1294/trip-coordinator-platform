services:
  postgres:
    image: postgres:16
    container_name: travel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    container_name: trip-app
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB}}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${POSTGRES_USER}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD}}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      APP_DOCUMENT_STORAGE_PROVIDER: ${APP_DOCUMENT_STORAGE_PROVIDER:-local}
      DOCUMENT_STORAGE_S3_BUCKET: ${DOCUMENT_STORAGE_S3_BUCKET:-}
      DOCUMENT_STORAGE_S3_REGION: ${DOCUMENT_STORAGE_S3_REGION:-us-east-1}
      DOCUMENT_PROCESSING_PUBLISHER_ENABLED: ${DOCUMENT_PROCESSING_PUBLISHER_ENABLED:-false}
      DOCUMENT_PROCESSING_SQS_QUEUE_URL: ${DOCUMENT_PROCESSING_SQS_QUEUE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data/documents:/app/data/documents
volumes:
  postgres_data: