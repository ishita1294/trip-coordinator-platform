services:
  postgres:
    image: postgres:16
    container_name: travel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    container_name: trip-app
    depends_on:
      - postgres
    environment:
      EXPLORE_GOOGLE_ENABLED: ${EXPLORE_GOOGLE_ENABLED:-false}
      EXPLORE_MAX_CONCURRENT_REQUESTS: ${EXPLORE_MAX_CONCURRENT_REQUESTS:-8}
      EXPLORE_MAX_CONCURRENT_PER_TRAVELER: ${EXPLORE_MAX_CONCURRENT_PER_TRAVELER:-2}
      EXPLORE_MAX_REQUESTS_PER_MINUTE: ${EXPLORE_MAX_REQUESTS_PER_MINUTE:-6}
      EXPLORE_DUPLICATE_WINDOW_SECONDS: ${EXPLORE_DUPLICATE_WINDOW_SECONDS:-5}
      EXPLORE_GOOGLE_MAX_CALLS_PER_REQUEST: ${EXPLORE_GOOGLE_MAX_CALLS_PER_REQUEST:-47}
      EXPLORE_GOOGLE_MAX_CALLS_PER_HOUR: ${EXPLORE_GOOGLE_MAX_CALLS_PER_HOUR:-120}
      OPENAI_EXPLORE_MODEL: ${OPENAI_EXPLORE_MODEL:-gpt-6-sol}
    ports:
      - "8080:8080"
    volumes:
      - ./data/documents:/app/data/documents
volumes:
  postgres_data:
