plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ishita'
version = '0.0.1-SNAPSHOT'
description = 'trip-coordinator-platform'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation platform('software.amazon.awssdk:bom:2.54.13')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:secretsmanager'
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
    implementation 'com.amazonaws:aws-lambda-java-events:3.16.1'
    implementation 'com.openai:openai-java:4.70.0'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    runtimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Lambda loads application classes and dependency JARs directly from lib/.
tasks.register('lambdaZip', Zip) {
    dependsOn tasks.named('jar')
    archiveFileName = 'document-processing-lambda.zip'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into('lib') {
        from tasks.named('jar')
        from configurations.runtimeClasspath
    }
}
