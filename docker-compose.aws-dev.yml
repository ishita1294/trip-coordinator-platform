# Use with docker-compose.yml; no fallback to the Docker database.
services:
  app:
    environment:
      EXPLORE_GOOGLE_ALERT_HOURLY_MICROS: ${EXPLORE_GOOGLE_ALERT_HOURLY_MICROS:-0}
      EXPLORE_GOOGLE_ALERT_DAILY_MICROS: ${EXPLORE_GOOGLE_ALERT_DAILY_MICROS:-0}
      EXPLORE_GOOGLE_ALERT_MONTHLY_MICROS: ${EXPLORE_GOOGLE_ALERT_MONTHLY_MICROS:-0}
      # Cutover complete: AWS-DEV cannot silently restart in legacy accounting mode.
      EXPLORE_GOOGLE_ACCOUNTING_RPC_ENABLED: "true"
      EXPLORE_GOOGLE_ACCOUNTING_MODE: durable
      EXPLORE_GOOGLE_ACCOUNTING_SCOPE: ${EXPLORE_GOOGLE_ACCOUNTING_SCOPE:?Approved durable accounting scope required}
      EXPLORE_GOOGLE_CAPACITY_CONCURRENT: ${EXPLORE_GOOGLE_CAPACITY_CONCURRENT:-6}
      EXPLORE_GOOGLE_CAPACITY_PER_ACTOR: ${EXPLORE_GOOGLE_CAPACITY_PER_ACTOR:-3}
      EXPLORE_GOOGLE_NEARBY_PER_MINUTE: ${EXPLORE_GOOGLE_NEARBY_PER_MINUTE:-0}
      EXPLORE_GOOGLE_TEXT_PER_MINUTE: ${EXPLORE_GOOGLE_TEXT_PER_MINUTE:-0}
      EXPLORE_GOOGLE_DETAILS_PER_MINUTE: ${EXPLORE_GOOGLE_DETAILS_PER_MINUTE:-0}
      EXPLORE_GOOGLE_ROUTES_PER_MINUTE: ${EXPLORE_GOOGLE_ROUTES_PER_MINUTE:-0}
      AUTH_ISSUER: ${AUTH_ISSUER:?Cognito issuer required}
      AUTH_JWK_SET_URI: ${AUTH_JWK_SET_URI:?Cognito JWKS URI required}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:?Cognito public client required}
      AUTH_API_SCOPE: ${AUTH_API_SCOPE:?Cognito API scope required}
      AUTH_USER_INFO_URI: ${AUTH_USER_INFO_URI:?Cognito user-info URI required}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${AWS_DEV_RDS_HOST:?AWS-DEV requires AWS_DEV_RDS_HOST}:5432/tripcoordinator?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${AWS_DEV_DATASOURCE_USERNAME:?AWS-DEV requires AWS_DEV_DATASOURCE_USERNAME}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_SQL_INIT_MODE: never
      APP_DOCUMENT_STORAGE_PROVIDER: s3
      DOCUMENT_STORAGE_S3_BUCKET: ${AWS_DEV_DOCUMENT_STORAGE_S3_BUCKET:?AWS-DEV requires AWS_DEV_DOCUMENT_STORAGE_S3_BUCKET}
      DOCUMENT_STORAGE_S3_REGION: us-east-1
      DOCUMENT_PROCESSING_PUBLISHER_ENABLED: ${AWS_DEV_DOCUMENT_PROCESSING_PUBLISHER_ENABLED:-false}
      DOCUMENT_PROCESSING_SQS_QUEUE_URL: ${AWS_DEV_DOCUMENT_PROCESSING_SQS_QUEUE_URL:-}
      DOCUMENT_PROCESSING_SQS_REGION: us-east-1
      GOOGLE_MAPS_SECRET_ARN: ${AWS_DEV_GOOGLE_MAPS_SECRET_ARN:-}
      RUNTIME_SECRETS_ENABLED: "true"
      RDS_SECRET_ARN: ${AWS_DEV_RDS_SECRET_ARN:?AWS-DEV requires AWS_DEV_RDS_SECRET_ARN}
      OPENAI_SECRET_ARN: ${AWS_DEV_OPENAI_SECRET_ARN:?AWS-DEV requires AWS_DEV_OPENAI_SECRET_ARN}
      AWS_REGION: us-east-1
      AWS_PROFILE: trip-coordinator-dev-api
      AWS_CONFIG_FILE: /run/aws-dev/config
      AWS_SHARED_CREDENTIALS_FILE: /run/aws-dev/no-static-credentials
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - type: bind
        source: ${AWS_DEV_CREDENTIAL_CACHE_DIR:?AWS-DEV requires AWS_DEV_CREDENTIAL_CACHE_DIR}
        target: /run/aws-dev
        read_only: true
        bind:
          create_host_path: false
