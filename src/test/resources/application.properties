spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travel_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:travel_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:travel_password}
app.ai.openai.classification-model=gpt-6-luna
app.ai.openai.extraction-model=gpt-6-sol
app.document-storage.provider=local
app.document-processing.publisher.enabled=false
