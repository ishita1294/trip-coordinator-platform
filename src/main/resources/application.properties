spring.application.name=trip-coordinator-platform
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.web.error.include-message=always
management.endpoint.health.group.readiness.include=readinessState,db
app.ai.conflict-resolution.provider=mock
app.ai.document-classification.provider=mock
app.ai.openai.classification-model=${OPENAI_CLASSIFICATION_MODEL:gpt-6-luna}
app.ai.openai.extraction-model=${OPENAI_EXTRACTION_MODEL:gpt-6-sol}
app.document-storage.provider=${DOCUMENT_STORAGE_PROVIDER:local}
app.document-storage.local-directory=./data/documents
app.document-storage.s3.bucket=${DOCUMENT_STORAGE_S3_BUCKET:}
app.document-storage.s3.region=${DOCUMENT_STORAGE_S3_REGION:us-east-1}
app.document-processing.publisher.enabled=${DOCUMENT_PROCESSING_PUBLISHER_ENABLED:false}
app.document-processing.publisher.delay-ms=${DOCUMENT_PROCESSING_PUBLISHER_DELAY_MS:2000}
app.document-processing.sqs.queue-url=${DOCUMENT_PROCESSING_SQS_QUEUE_URL:}
app.document-processing.sqs.region=${DOCUMENT_PROCESSING_SQS_REGION:us-east-1}
app.document-processing.worker.lease-seconds=${DOCUMENT_PROCESSING_WORKER_LEASE_SECONDS:120}
